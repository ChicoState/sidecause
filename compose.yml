name: sidecause

services:
  app:
    build:
      context: .
      target: development
    command: npm run dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://sidecause:sidecause@postgres:5432/sidecause?schema=public
      S3_ENDPOINT: http://minio:9000
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/node_modules
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles: ['app']
    networks: [sidecause]

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: sidecause
      POSTGRES_USER: sidecause
      POSTGRES_PASSWORD: sidecause
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sidecause -d sidecause']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [sidecause]

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2025-12-20T04-58-37Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [sidecause]

volumes:
  app_node_modules:
  postgres_data:
  minio_data:

networks:
  sidecause:
    driver: bridge
